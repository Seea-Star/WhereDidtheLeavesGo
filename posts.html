<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Feed</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* SFONDO INTERNO DEL TELEFONO */
    body {
      background-color: #fcfcf8;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* BARRA SUPERIORE A TUTTA LARGHEZZA */
    .social-header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      border-bottom: 2px solid #111111;
      padding: 10px 15px;
      display: flex;
      justify-content: space-between; /* Spinge il logo a sinistra e il profilo a destra */
      align-items: center;
      z-index: 10;
    }

    /* LOGO DEL SOCIAL A SINISTRA (BEN VISIBILE) */
    .header-logo-img {
      height: 38px; /* Dimensione grande e chiara */
      width: auto;
      max-width: 60%;
      object-fit: contain;
      display: block;
    }

    /* FOTO PROFILO A DESTRA (CERCHIO BEN VISIBILE) */
    .header-profile-container {
      width: 40px; /* Dimensione ideale per la foto profilo */
      height: 40px;
      border-radius: 50%;
      border: 2px solid #111111;
      overflow: hidden;
      flex-shrink: 0;
      background: #eee;
    }

    .header-profile-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* AREA SCROLLABILE DEI POST */
    .feed-scroll-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* CONTENITORE DEL SINGOLO POST (IMMAGINE + BARRA PULSANTI) */
    .post-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    .post-img {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .post-img img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    /* BARRA PULSANTI A TUTTA LARGHEZZA */
    .post-buttons {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 4px;
    }

    .post-buttons img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIORE CON LOGO A SINISTRA E PROFILO A DESTRA -->
  <header class="social-header">
    <!-- Logo Social (Sinistra) -->
    <img src="app-logo.png" alt="App Logo" class="header-logo-img" onerror="this.parentElement.innerHTML='<span style=\'font-weight:800; font-size:1.1rem;\'>LeafGram</span>'">

    <!-- Foto Profilo (Destra) -->
    <div class="header-profile-container">
      <img src="profile.png" alt="Profile" onerror="this.style.display='none'">
    </div>
  </header>

  <!-- CONTENITORE SCROLLABILE DEI POST -->
  <div class="feed-scroll-container">

    <!-- POST 1 -->
    <div class="post-card">
      <div class="post-img">
        <img src="https://raw.githubusercontent.com/Seea-Star/Cosmic-S-Watchlist/refs/heads/main/watchlist-01.png" alt="Post 1">
      </div>
      <div class="post-buttons">
        <img src="button-bar.png" alt="Actions" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- POST 2 -->
    <div class="post-card">
      <div class="post-img">
        <img src="https://raw.githubusercontent.com/Seea-Star/Cosmic-S-Watchlist/refs/heads/main/watchlist-02.png" alt="Post 2">
      </div>
      <div class="post-buttons">
        <img src="button-bar.png" alt="Actions" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- POST 3 -->
    <div class="post-card">
      <div class="post-img">
        <img src="https://raw.githubusercontent.com/Seea-Star/Cosmic-S-Watchlist/refs/heads/main/watchlist-03.png" alt="Post 3">
      </div>
      <div class="post-buttons">
        <img src="button-bar.png" alt="Actions" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- POST 4 -->
    <div class="post-card">
      <div class="post-img">
        <img src="https://raw.githubusercontent.com/Seea-Star/Cosmic-S-Watchlist/refs/heads/main/watchlist-04.png" alt="Post 4">
      </div>
      <div class="post-buttons">
        <img src="button-bar.png" alt="Actions" onerror="this.style.display='none'">
      </div>
    </div>

  </div>

</body>
</html>
