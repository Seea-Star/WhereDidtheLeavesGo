<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Feed</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* SFONDO INTERNO DEL TELEFONO */
    body {
      background-color: #fcfcf8;
      padding: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* BARRA SUPERIORE UNICA (LOGO A SINISTRA + PROFILO A DESTRA) */
    .social-header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      border-bottom: 2px solid #111111;
      padding: 8px 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .social-header img {
      max-height: 28px; /* Regola l'altezza se vuoi farla più grande o più piccola */
      width: auto;
      display: block;
    }

    /* AREA DEI POST SCROLLABILE */
    .feed-scroll-container {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* CONTENITORE DEL SINGOLO POST (IMMAGINE + BARRA PULSANTI) */
    .post-card {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
    }

    /* IMMAGINE PRINCIPALE DEL POST */
    .post-img {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .post-img img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    /* BARRA DEI PULSANTI SOTTO L'IMMAGINE (TRASPARENTE E PULITA) */
    .post-buttons {
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 4px;
    }

    .post-buttons img {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIORE CON L'IMMAGINE UNICA (LOGO + PROFILO) -->
  <header class="social-header">
    <!-- Sostituisci 'header-bar.png' con il nome esatto della tua immagine combinata -->
    <img src="header-bar.png" alt="Social Header" onerror="this.parentElement.innerHTML='<span style=\'font-weight:800; font-size:0.85rem;\'>Social App</span>'">
  </header>

  <!-- CONTENITORE SCROLLABILE DEI POST -->
  <div class="feed-scroll-container">

    <!-- POST 1 -->
    <div class="post-card">
      <div class="post-img">
        <img src="https://raw.githubusercontent.com/Seea-Star/Cosmic-S-Watchlist/refs/heads/main/watchlist-01.png" alt="Post 1">
      </div>
      <div class="post-buttons">
        <img src="button-bar.png" alt="Actions" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- POST 2 -->
    <div class="post-card">
      <div class="post-img">
        <img src="https://raw.githubusercontent.com/Seea-Star/Cosmic-S-Watchlist/refs/heads/main/watchlist-02.png" alt="Post 2">
      </div>
      <div class="post-buttons">
        <img src="button-bar.png" alt="Actions" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- POST 3 -->
    <div class="post-card">
      <div class="post-img">
        <img src="https://raw.githubusercontent.com/Seea-Star/Cosmic-S-Watchlist/refs/heads/main/watchlist-03.png" alt="Post 3">
      </div>
      <div class="post-buttons">
        <img src="button-bar.png" alt="Actions" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- POST 4 -->
    <div class="post-card">
      <div class="post-img">
        <img src="https://raw.githubusercontent.com/Seea-Star/Cosmic-S-Watchlist/refs/heads/main/watchlist-04.png" alt="Post 4">
      </div>
      <div class="post-buttons">
        <img src="button-bar.png" alt="Actions" onerror="this.style.display='none'">
      </div>
    </div>

  </div>

</body>
</html>
